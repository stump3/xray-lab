# docker/compose.yml — вариант А в Docker (для теста без реального сервера)
#
# Использование:
#   cd docker
#   docker compose --env-file ../scenarios/variant-a/vars.env up -d
#   docker compose logs -f
#   docker compose down
#
# Для полного теста нужен реальный сервер — Docker не даст сетевую изоляцию
# такого уровня. Compose используется как удобная обёртка для локального dev.

name: xray-lab-variant-a

services:

  # ── Xray сервер ──────────────────────────────────────────────────────────────
  xray-server:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-lab-server
    restart: unless-stopped
    network_mode: host          # Reality требует реальный порт (не mapped)
    cap_add:
      - NET_BIND_SERVICE        # порт < 1024 без root
    volumes:
      - ./rendered/xray-server.json:/etc/xray/config.json:ro
      - xray-logs:/var/log/xray
    command: ["run", "-c", "/etc/xray/config.json"]
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tlnp | grep -q :${XRAY_PORT:-443}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Nginx (subscription endpoint) ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: xray-lab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    volumes:
      - ./rendered/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www:ro
    depends_on:
      xray-server:
        condition: service_healthy

  # ── Xray клиент (для локального тестирования) ─────────────────────────────────
  # Запускать отдельно: docker compose up xray-client
  xray-client:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-lab-client
    profiles: ["client"]       # не стартует по умолчанию
    network_mode: host
    volumes:
      - ./rendered/xray-client.json:/etc/xray/config.json:ro
    command: ["run", "-c", "/etc/xray/config.json"]

volumes:
  xray-logs:
